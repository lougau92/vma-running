name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- 1. SETUP ENVIRONMENT ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Read pinned feedback dependency
        id: feedback
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          text = Path('pubspec.yaml').read_text()
          match = re.search(r'(?m)^  app_feedback:\n    git:\n      url: https://github.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)\.git\n      ref: ([0-9a-f]{40})\s*$', text)
          if not match:
              raise SystemExit('Expected a GitHub feedback dependency pinned to a full commit SHA.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'repository={match[1]}\nref={match[2]}\n')
          PYCODE

      - name: Checkout shared feedback package
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.feedback.outputs.repository }}
          ref: ${{ steps.feedback.outputs.ref }}
          path: .dependencies/app-feedback
          ssh-key: ${{ secrets.APP_FEEDBACK_DEPLOY_KEY }}
          persist-credentials: false

      - name: Use shared feedback checkout
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          Path('pubspec_overrides.yaml').write_text('dependency_overrides:\n  app_feedback:\n    path: .dependencies/app-feedback\n')
          PYCODE

      - name: Install Flutter Dependencies
        run: flutter pub get

      # --- 2. VERSION MANAGEMENT ---
      - name: Read version from pubspec.yaml
        id: app_version
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          text = Path('pubspec.yaml').read_text()
          match = re.search(r'(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+([0-9]+))?\s*$', text)
          if not match:
              raise SystemExit('Expected pubspec.yaml version in MAJOR.MINOR.PATCH+BUILD format.')
          version_name = match[1]
          build_number = match[2] or '1'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version_name={version_name}\nbuild_number={build_number}\n')
          print(f'Using app version {version_name}+{build_number} from pubspec.yaml')
          PYCODE

      - name: Stamp Service Worker Version
        run: node tool/inject-sw-version.mjs
        env:
          BUILD_NAME: ${{ steps.app_version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.app_version.outputs.build_number }}

      # --- SINGLE BUILD ---
      - name: Build Web App
        run: |
          flutter build web --release \
            --base-href "/vma-running/" \
            --build-name=${{ steps.app_version.outputs.version_name }} \
            --build-number=${{ steps.app_version.outputs.build_number }}

      # Remove Flutter's generated SW to force using ours
      - name: Remove Default Service Worker
        run: rm build/web/flutter_service_worker.js

      # --- TEST ---
      - name: Verify Offline Capabilities
        run: node tool/sw-offline-test.mjs
        env:
          SW_TEST_PORT: 8080
          BASE_HREF: "/vma-running/"

      # --- DEPLOY ---
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
      # --- 6. DEPLOY ---
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
